[project]
name = "esgfin"
version = "0.1.0"
description = "ESG 氣候風險→會計科目分析系統（碩士論文研究用）"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.33.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esgfin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
