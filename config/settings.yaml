# 系統設定（SPEC 4.2）。改動會影響結果的設定後，--resume 會拒絕接續舊 run。

llm:
  provider: gemini
  model: gemini-3.8-flash
  thinking_level: medium        # low / medium / high（不可用 minimal）
  max_output_tokens: null       # null = 使用 API 預設（上限 65,536）
  validation_retries: 2         # 回應未通過 pydantic 驗證時，附上錯誤重問的次數
  timeout_s: 600
  # 不設 temperature：google-genai SDK 已將 generation_config.temperature 標為 deprecated

rate_limit:                     # 付費帳號，實際額度依 Google AI Studio 顯示為準
  requests_per_minute: 60       # 保守值，可依帳號額度調高
  tokens_per_minute: null       # null = 不限

retry:                          # 429、5xx、連線錯誤的指數退避
  max_attempts: 5
  initial_backoff_s: 2
  multiplier: 2
  max_backoff_s: 60
  jitter: true

pricing:                        # 只用於估算花費（美元／百萬 token）；不影響結果
  # 來源：https://aistudio.google.com/docs/pricing（原 https://ai.google.dev/gemini-api/docs/pricing 轉址）
  # 查詢日期：2026-11-10；Gemini 3.8 Flash，付費 Standard tier
  # 此價格適用至 2026-12-31；2027-01-01 起輸入 1.50、輸出 7.50，屆時請更新
  input_usd_per_million_tokens: 0.75
  output_usd_per_million_tokens: 3.75   # 含 thinking token

parse:
  parser: docling               # docling / pymupdf4llm【已決定 10/29：Docling】
  min_text_page_ratio: 0.5      # 有文字層的頁數比例低於此值視為掃描檔，停止該份

locate:
  toc_scan_pages: 20            # 沒有書籤時掃描前幾頁找目錄
  section_page_buffer: 1        # 章節範圍前後各加幾頁
  bookmark_min_entries: 5       # 書籤至少幾項且多數標題有意義才採用，否則找目錄頁
  toc_min_numbers: 10           # 目錄頁至少要有幾個頁碼數字
  margin_ratio: 0.12            # 頁首頁尾、側邊欄：距頁面邊緣多少比例內的文字
  nav_min_pages: 5              # 邊緣文字在至少幾頁重複出現才算導覽列
  offset_min_agreement: 0.3     # 印刷頁碼位移的眾數至少要符合多少比例的頁
  min_keyword_hits: 2           # 策略表候選頁至少命中幾個不同關鍵字（已排除導覽列）
  max_strategy_candidates: 15   # 最多送幾個候選頁給 LLM 判斷
  max_chars_per_candidate_page: 8000
  max_index_pages: 8            # 書末索引最多送幾頁給 LLM

extract:
  input_mode: text+pdf          # text / text+pdf；作用於 S3a 表格重建（SPEC 7.6），S3 一律只吃重建表文字

reason:
  thinking_level: medium        # S5 P2 推理專用（low / medium / high）；其他階段用 llm.thinking_level

check:
  citation_page_buffer: 1       # 引文驗證比對頁的前後緩衝
  fuzzy_pass_ratio: 0.9         # 模糊通過門檻【M5 再定】

context_card:
  enabled: false                # ver1 不實作

site:
  port: 8765                    # 只綁 127.0.0.1

prompts:                        # 名稱: 版本 → prompts/<名稱>_v<版本>.md
  s2_toc: 1
  s2_roles: 1
  s2_strategy: 1
  s2_index: 1
  s3a_table: 1
  s3_extract: 4                 # v4：描述事件的欄（含標題、短名稱欄）皆對應事件描述，未使用只用於無關的欄；v3：同義詞表命中即填原文；v2：等級整欄判斷
  p2_reasoning: 1
  ref_tcfd_examples: 1          # S3 的 TCFD 例句參考檔（不是提示，但同樣記錄版本與雜湊）
